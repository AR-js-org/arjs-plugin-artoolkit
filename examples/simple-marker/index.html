<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Marker Example - ARToolKit Plugin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }
      h1 {
        color: #333;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        background-color: #f0f0f0;
      }
      .status.success {
        background-color: #d4edda;
        color: #155724;
      }
      .status.error {
        background-color: #f8d7da;
        color: #721c24;
      }
      .log {
        background: #f5f5f5;
        padding: 10px;
        border-radius: 4px;
        max-height: 300px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
      }
      button {
        padding: 10px 16px;
        margin: 6px;
        cursor: pointer;
        border: none;
        border-radius: 4px;
        background: #007bff;
        color: white;
      }
      button[disabled] {
        background: #999;
        cursor: default;
      }
      #video {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Simple Marker Example</h1>
    <p>
      This example demonstrates loading two pattern markers (hiro and kanji)
      from a single ARToolKit plugin instance. Each gets its own marker ID, and
      every event logged below shows both <code>type</code> and
      <code>markerId</code> so you can tell markers apart.
    </p>

    <div id="status" class="status">Initializing...</div>
    <div>
      <button id="startCamBtn">Start Camera</button>
      <button id="loadMarkerBtn" disabled>Load Markers</button>
    </div>

    <h3>Event Log:</h3>
    <div id="log" class="log"></div>

    <video id="video" autoplay playsinline></video>

    <!-- Only showing the <script type="module"> block; keep the rest unchanged -->
    <script type="module">
      import { ArtoolkitPlugin } from "../../dist/arjs-plugin-artoolkit.es.js";

      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const loadMarkerBtn = document.getElementById("loadMarkerBtn");
      const startCamBtn = document.getElementById("startCamBtn");
      const video = document.getElementById("video");

      function log(message) {
        const ts = new Date().toISOString();
        const el = document.createElement("div");
        el.textContent = `[${ts}] ${message}`;
        logEl.appendChild(el);
        logEl.scrollTop = logEl.scrollHeight;
        console.log(message);
      }

      function setStatus(msg, type = "normal") {
        statusEl.textContent = msg;
        statusEl.className = "status";
        if (type === "success") statusEl.classList.add("success");
        if (type === "error") statusEl.classList.add("error");
      }

      const eventBus = {
        _h: new Map(),
        on(e, h) {
          if (!this._h.has(e)) this._h.set(e, []);
          this._h.get(e).push(h);
        },
        off(e, h) {
          if (!this._h.has(e)) return;
          this._h.set(
            e,
            this._h.get(e).filter((x) => x !== h),
          );
        },
        emit(e, p) {
          (this._h.get(e) || []).forEach((fn) => fn(p));
        },
      };
      const core = { eventBus };

      let plugin;

      async function start() {
        try {
          log("Creating ArtoolkitPlugin instance (dist build)…");
          plugin = new ArtoolkitPlugin({
            worker: true,
            cameraParametersUrl: "/examples/simple-marker/data/camera_para.dat",
            // Vite's library build does not copy the WASM binary into dist/, and
            // artoolkit5-ts resolves it relative to the worker chunk when no URL
            // is given — so it must be pointed at explicitly. `npm run
            // smoke:browser` serves the repository root, which makes the
            // installed package's copy reachable at this path.
            wasmUrl:
              "/node_modules/@ar-js-org/artoolkit5-wasm/dist/artoolkit5.wasm",
          });

          // Register listeners BEFORE enable to avoid missing early 'ready'
          eventBus.on("ar:workerReady", () => {
            log("Worker ready");
            setStatus(
              "Worker ready. Start camera and then load markers.",
              "success",
            );
            loadMarkerBtn.disabled = false;
          });
          eventBus.on("ar:workerError", (e) => {
            log(`workerError: ${JSON.stringify(e)}`);
            setStatus("Worker error (see console)", "error");
          });
          eventBus.on("ar:markerFound", (e) =>
            log(`FOUND ${e.type}:${e.markerId} cf=${e.confidence.toFixed(2)}`),
          );
          eventBus.on("ar:markerUpdated", (e) =>
            log(`UPDATED ${e.type}:${e.markerId}`),
          );
          eventBus.on("ar:markerLost", (e) =>
            log(`LOST ${e.type}:${e.markerId}`),
          );

          await plugin.init(core);
          await plugin.enable();

          // Fallback: if worker became ready during enable, honor it
          if (plugin.workerReady) {
            log("Worker was already ready (post-enable).");
            setStatus(
              "Worker ready. Start camera and then load markers.",
              "success",
            );
            loadMarkerBtn.disabled = false;
          } else {
            setStatus("Plugin initialized. Waiting for worker…", "normal");
          }
        } catch (err) {
          log("Init error: " + (err && err.message ? err.message : err));
          setStatus("Initialization error", "error");
        }
      }

      startCamBtn.addEventListener("click", async () => {
        try {
          startCamBtn.disabled = true;
          log("Starting camera…");
          video.srcObject = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          let id = 0;

          async function tick() {
            if (video.videoWidth === 0) {
              requestAnimationFrame(tick);
              return;
            }
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const imageBitmap = await createImageBitmap(canvas);
            core.eventBus.emit("engine:update", {
              id: ++id,
              imageBitmap,
              width: canvas.width,
              height: canvas.height,
            });
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
          log("Camera started.");
          setStatus("Camera started. You can now load the markers.", "success");
        } catch (err) {
          log("Camera error: " + (err && err.message ? err.message : err));
          setStatus("Camera error", "error");
          startCamBtn.disabled = false;
        }
      });

      loadMarkerBtn.addEventListener("click", async () => {
        if (!plugin) return log("Plugin not ready");
        loadMarkerBtn.disabled = true;
        setStatus("Loading markers…", "normal");
        try {
          const patterns = [
            { url: "/examples/simple-marker/data/patt.hiro", label: "hiro" },
            { url: "/examples/simple-marker/data/patt.kanji", label: "kanji" },
          ];

          const loaded = [];
          for (const { url, label } of patterns) {
            log(`Requesting loadMarker for ${label}`);
            const res = await plugin.loadMarker(url, 1);
            log(`${label} loaded: ${JSON.stringify(res)}`);
            loaded.push(`${label}=${res.markerId}`);
          }
          setStatus(
            `Markers loaded (${loaded.join(", ")}). Show either to the camera.`,
            "success",
          );
        } catch (err) {
          log("loadMarker failed: " + (err && err.message ? err.message : err));
          setStatus("Failed to load marker", "error");
        } finally {
          loadMarkerBtn.disabled = false;
        }
      });

      start();
    </script>
  </body>
</html>
