name: Build and Release

# Builds the library and attaches the result to a GitHub Release. It does **not**
# publish to npm - `publish.yml` does that, and both trigger on the same tag push.
# Keeping them apart means a failed npm publish does not also lose the release
# assets, and the publish can be re-run on its own.
#
# This file is the resolution of #30: `main` carried five release-workflow fixes
# from 0.1.3 that `dev` never received, while `dev` had independently gained
# improvements of its own. Both sides are kept - see the comments below, which say
# which side each piece came from and why, so the next person does not have to redo
# this comparison.

on:
  push:
    tags:
      - "v*.*.*"
  # From `dev`. `main` has a bare `workflow_dispatch:`, which looks harmless and is
  # not: its tag step reads `${GITHUB_REF##*/}` unconditionally, so a manual run
  # from a branch resolves the tag to the branch name and creates a GitHub Release
  # called `main`. The input plus the validation below makes a manual run either
  # correct or refused.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (required for manual dispatch)"
        required: false

jobs:
  # Two jobs, from `main` (25727c8, cb0f49c). The split is what lets the release
  # job start from a clean checkout and take the built tree as an artifact, rather
  # than trusting whatever a single job left on disk.
  build:
    # Pinned, from `dev`. `main` uses `ubuntu-latest`, which moves under you - and
    # GitHub is migrating that label to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    env:
      HUSKY: 0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # No `|| true` on build:types, from `main`. `dev` had
      # `npm run build:types || true`, which swallowed a real failure: artoolkit5-ts
      # ships declarations with extensionless relative imports, invalid under this
      # repository's `nodenext`, and tsc emits anyway because `noEmitOnError` is
      # unset. So `types/` looked fine while the step was exiting non-zero.
      #
      # #34 fixed the cause with `skipLibCheck: true`, which is why dropping the
      # `|| true` is safe now and would not have been before. The upstream fix is
      # AR-js-org/artoolkit5-ts#85.
      - name: Build
        run: |
          npm run build
          npm run build:types

      # From `dev`. Cheap, and it fails here with a clear message rather than three
      # steps later with an empty asset list.
      - name: Ensure dist exists
        run: |
          if [ ! -d dist ]; then
            echo "Nothing in dist/ to release" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            types/
            package.json

  release:
    needs: build
    runs-on: ubuntu-24.04
    # From `main`. The repository default is currently `write`, so this changes
    # nothing today - which is the point of stating it: the job keeps working if
    # that default is ever tightened, and it documents that creating a Release is
    # the only write this job needs.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      # `main`'s version of this step reads `${GITHUB_REF##*/}` with no check, so a
      # manual dispatch produces a release named after the branch. `dev`'s
      # validation is kept instead.
      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              echo "Error: a manual dispatch needs a tag input, or the workflow must be triggered by a tag push" >&2
              echo "GITHUB_REF=$GITHUB_REF is not a tag reference" >&2
              exit 1
            fi
            ref_name=${GITHUB_REF##*/}
            echo "tag=$ref_name" >> $GITHUB_OUTPUT
          fi

      # Zipped, from `main` (e718530). `dev` uploaded `dist/*` as loose files, which
      # flattens the tree: `dist/assets/worker-<hash>.js` arrives as a bare file
      # with no indication it belongs in `assets/`, and the bundle cannot find it.
      # A zip preserves the structure.
      - name: Prepare release assets
        run: |
          if [ -d types ]; then
            zip -r types.zip types
          fi
          if [ -d dist ]; then
            zip -r dist.zip dist
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          ASSETS=""
          if [ -f dist.zip ]; then
            ASSETS="$ASSETS dist.zip"
          fi
          if [ -f types.zip ]; then
            ASSETS="$ASSETS types.zip"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets..."
            gh release upload "$TAG" $ASSETS --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" $ASSETS --title "$TAG" --notes "Automated release with built assets"
          fi

      # From `dev`. Prints what actually landed, so a run that succeeded with no
      # assets attached is visible in the log rather than discovered later.
      - name: Show uploaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "${{ steps.tag.outputs.tag }}" --json assets --jq '.assets[].name'
